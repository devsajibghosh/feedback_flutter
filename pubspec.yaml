name: feedback
description: "Feedback Machine — kiosk feedback app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.5.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  dio: ^5.7.0
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  sqflite: ^2.4.1
  # Desktop-only SQLite backend. The real `sqflite` plugin above has no
  # Linux/Windows/macOS implementation at all, so without this the app can't
  # open its database — or even run — off Android/iOS. main.dart wires it in
  # only when Platform.isAndroid/isIOS is false, so the production mobile
  # path is completely unaffected; this exists so the app (and its database
  # layer specifically) can be run and verified on a dev desktop machine.
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  connectivity_plus: ^6.1.0
  meta: ^1.15.0
  # This project's Flutter 3.24-era Gradle template doesn't propagate
  # `flutter.compileSdkVersion` to plugin subprojects, so any plugin version
  # that reads it directly fails with "compileSdkVersion is not specified"
  # before a single line of Dart runs. wakelock_plus 1.3.1+ has that broken
  # property read (1.4.0 was what pub picked from our old ^1.2.10
  # constraint); 1.3.3 hardcodes `compileSdk 34` instead, and pinning it here
  # also naturally keeps its package_info_plus dependency below the 9.0.0
  # break, so no separate override is needed for that one either.
  wakelock_plus: 1.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^4.0.0

  flutter_launcher_icons: ^0.14.1
  # For tool/verify_sync_test.dart only: lets that harness point
  # path_provider at a real temp directory without a platform channel.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/img/icon.png"
  adaptive_icon_background: "#1B4D3E"
  adaptive_icon_foreground: "assets/img/icon_foreground.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/img/bd_blurred.png
    - assets/img/noise.png

  fonts:
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Regular.ttf
          weight: 400
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-Bold.ttf
          weight: 700
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Light.ttf
          weight: 300
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: Hind Siliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
    - family: Noto Color Emoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
